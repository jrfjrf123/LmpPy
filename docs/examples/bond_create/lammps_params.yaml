# =============================================================================
# lammps_params.yaml — bond/create 模式 LAMMPS 参数示例 (交联体系)
# =============================================================================
# 本文件定义 bond/create 模式下的完整 LAMMPS 运行参数。
# 不依赖分子模板文件（.lammpstemplate 或 .map），所有建键规则
# 通过 bond_create 配置段中的 create_pairs 列表定义。
#
# 使用说明:
#   - 此配置仅需 YAML 文件，无需 reactions/ 目录结构
#   - bond_create.enabled=true 时，bond_react.reactions 不能存在
# =============================================================================

# =============================================================================
# 模拟基本参数
# =============================================================================
simulation:
  loop_num: 1000             # 主循环次数
  dt: 0.001                  # 时间步长 (ps)
  timestep: 1                # LAMMPS timestep 设置 (fs)
  temperature: 450           # 目标温度 (K) — 交联通常需要较高温度
  pressure: 1.0              # 目标压力 (atm)
  ensemble: "npt"            # 系综类型: NPT 允许体积收缩（交联网络致密化）

# =============================================================================
# 步数配置
# =============================================================================
steps:
  bond_react_check: 1        # 键反应检查步数
  run_per_loop: 50           # 每个 loop 运行总步数
  nve_limit: 20              # NVE/limit 步数（新成键原子局部弛豫）

# =============================================================================
# NPT 控温控压参数
# =============================================================================
npt:
  tcouple: 100               # 温度耦合常数 (fs)
  pcouple: 1000              # 压力耦合常数 (fs)

# =============================================================================
# Bond/Create 配置（核心）
# =============================================================================
# bond/create 模式下，程序通过以下参数控制原子间的建键行为。
# 每对 (itype, jtype) 定义一组建键规则，对应一条独立的 LAMMPS fix 命令。
bond_create:
  enabled: true               # 启用 bond/create 模式（与 bond_react 互斥）

  # ---------------------------------------------------------------------------
  # 建键类型对列表
  # ---------------------------------------------------------------------------
  # 每个 pair 定义: 哪些原子类型对、多近距离、创建什么类型的键
  pairs:
    # 交联剂 + A 端基 → 形成网络连接
    - itype: 1                # 供体原子类型（交联剂）
      jtype: 4                # 受体原子类型（A 端基）
      Nevery: 1               # 每 1 步检查一次建键条件
      Rmin: 3.5               # 建键最大距离 (Angstrom)
      bondtype: 1             # 新创建键的类型编号

      # i 原子（交联剂）参数
      iparam:
        maxbond: 4            # 最大可形成 4 个键
        newtype: 6            # 达到 maxbond 后变为类型 6（饱和交联剂）

      # j 原子（A 端基）参数
      jparam:
        maxbond: 1            # 最大可形成 1 个键
        newtype: 7            # 成键后变为类型 7（已反应的端基）

    # 交联剂 + B 端基 → 形成网络连接
    - itype: 1                # 供体原子类型（交联剂）
      jtype: 5                # 受体原子类型（B 端基）
      Nevery: 1               # 每 1 步检查一次
      Rmin: 3.5               # 建键最大距离 (Angstrom)
      bondtype: 2             # 新创建键的类型编号（与上一对不同类型）
      iparam:
        maxbond: 4
        newtype: 6
      jparam:
        maxbond: 1
        newtype: 8            # 成键后变为类型 8（已反应的 B 端基）

  # ---------------------------------------------------------------------------
  # CG 映射更新配置
  # ---------------------------------------------------------------------------
  # 当 bond/create 成键后，程序根据此表更新 CG 映射中对应 bead 的类型。
  # 键: 旧的 CG bead type，值: 新的 CG bead type。
  cg_update:
    type_map:
      1: 1                    # 交联剂类型不变
      4: 3                    # A 端基反应后变为链内类型 3
      5: 4                    # B 端基反应后变为链内类型 4

  # ---------------------------------------------------------------------------
  # 执行模式
  # ---------------------------------------------------------------------------
  sequential: true            # 是否顺序执行多个 bond/create fix
                              # true: 依次执行，避免多个 fix 同时操作同组原子导致冲突
  relax_radius: 0.5           # 松弛半径 (Angstrom)。新成键后对反应原子周围区域
                              # 进行位置松弛，消除局部应力。0.0 表示不启用。

# =============================================================================
# 输入输出文件配置
# =============================================================================
files:
  # --- 输入文件 ---
  data_file: "crosslink_system.data"               # LAMMPS 初始数据文件
  initial_cg_mapping: "AtomId_BeadId_compare_list.csv"  # 初始 CG 映射

  # read_data 额外参数
  read_data_extra:
    special_per_atom: 6
    bond_per_atom: 6
    angle_per_atom: 6
    dihedral_per_atom: 6

  # --- 输出文件 ---
  output_cg_trajectory: "cg_trajectory.lammpstrj"
  output_reaction_count: "reaction_num.txt"
  output_final_data: "final_frame.data"
  output_final_mapping: "final_cg_compare_list.csv"

  # CG 拓扑输出
  output_cg_bonds: "cg_bonds.txt"
  output_cg_angles: "cg_angles.txt"
  output_cg_dihedrals: "cg_dihedrals.txt"
