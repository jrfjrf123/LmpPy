# =============================================================================
# system.yaml — 交联体系 bond/create 模式配置示例
# =============================================================================
# 本文件定义交联聚合体系的粗粒化(CG)映射配置。
# 适用于 bond/create 距离条件建键模式。
#
# 【注意】本目录是字段参考骨架，不是可直接运行的完整配置：
#         此处 mapping_files 引用的 mapping YAML 与 files.data_file 指向的
#         .data 文件均不存在，需自行准备。可直接运行的完整示例见
#         docs/examples/（mini_test 体系）。
#
# 体系说明:
#   - 双组分交联体系（端基 A + 端基 B 在交联剂作用下形成网络）
#   - 反应类型: 非特异性交联（仅依赖距离和原子类型条件）
#   - 无需反应模板文件（.lammpstemplate 或 .map）
# =============================================================================

system:
  # 体系名称，用于日志输出和标识
  name: "Cross-linking polymer network"

  # ---------------------------------------------------------------------------
  # Bead 类型名称到 LAMMPS type 编号的映射
  # ---------------------------------------------------------------------------
  # bond/create 模式中 bead_type 在反应后可能通过 cg_update.type_map 更新。
  # 初始状态下，各组分有独立的类型编号。
  bead_type_names:
    Crosslinker: 1            # 交联剂 bead（类型 1）
    Polymer_A: 2              # 聚合物 A 链段（类型 2）
    Polymer_B: 3              # 聚合物 B 链段（类型 3）
    End_A: 4                  # A 端基（类型 4，反应前活跃端基）
    End_B: 5                  # B 端基（类型 5，反应前活跃端基）

  # ---------------------------------------------------------------------------
  # 分子映射文件列表
  # ---------------------------------------------------------------------------
  # 按照数据文件中分子的出现顺序列出。
  # 每个映射文件独立定义 site-types 和 config 段。
  # anchor 固定为 0，程序自动累积偏移。
  mapping_files:
    - path: "crosslinker_mapping.yaml"
      copies: 1000           # 1000 个交联剂分子
    - path: "polymer_A_mapping.yaml"
      copies: 100            # 100 条 A 型聚合物链
    - path: "polymer_B_mapping.yaml"
      copies: 100            # 100 条 B 型聚合物链
    - path: "end_A_mapping.yaml"
      copies: 200            # 200 个 A 端基分子
    - path: "end_B_mapping.yaml"
      copies: 200            # 200 个 B 端基分子

  # ---------------------------------------------------------------------------
  # 工作目录和输出目录（可选）
  # ---------------------------------------------------------------------------
  work_dir: "work"
  output_dir: "output"
