# =============================================================================
# system.yaml — EPR体系 bond/react 模式配置示例
# =============================================================================
# 本文件定义环氧树脂(EPR)体系的粗粒化(CG)映射配置。
# 适用于 bond/react 模板匹配建键模式。
#
# 【注意】本目录是字段参考骨架，不是可直接运行的完整配置：
#         此处 mapping_files 引用的 mapping YAML 与 files.data_file 指向的
#         .data 文件均不存在，需自行准备。可直接运行的完整示例见
#         docs/examples/（mini_test 体系）。
#
# 体系说明:
#   - 环氧树脂聚合反应（EPR 体系）
#   - 包含多种单体分子（dimer_EE, dimer_EP, ethylene, propylene 等）
#   - 反应类型: 开环聚合
# =============================================================================

system:
  # 体系名称，用于日志输出和标识
  name: "EPR polymerization"

  # ---------------------------------------------------------------------------
  # Bead 类型名称到 LAMMPS type 编号的映射
  # ---------------------------------------------------------------------------
  # 键: bead 类型名称（字符串），必须与 mapping 文件中 site-types 的名称一致
  # 值: LAMMPS 中的 type 编号（正整数）
  # 注意: 所有 mapping 文件中定义的 site-types 必须在此覆盖，且类型 ID 唯一
  bead_type_names:
    Bead1: 3     # EPR 链内 bead（类型 3）
    Bead2: 3     # EPR 链内 bead（类型 3，与 Bead1 同一 LAMMPS type）
    Bead3: 5     # EPR 端基 bead（类型 5）
    Bead4: 3     # EPR 链内 bead（类型 3）
    Bead5: 4     # 单体 bead（类型 4）
    Bead6: 5     # 端基 bead（类型 5）
    Bead7: 1     # 引发剂 bead（类型 1）
    Bead8: 2     # 另一单体 bead（类型 2）

  # ---------------------------------------------------------------------------
  # 分子映射文件列表
  # ---------------------------------------------------------------------------
  # 按照数据文件中分子的出现顺序列出。
  # path:   映射 YAML 文件路径（相对于配置目录）
  # copies: 该类型分子在初始 data 文件中的数量
  mapping_files:
    - path: "dimer_EE_initiator_mapping.yaml"
      copies: 25         # 25 个二聚体 EE 引发剂分子
    - path: "dimer_EP_initiator_mapping.yaml"
      copies: 25         # 25 个二聚体 EP 引发剂分子
    - path: "ethylene_mapping.yaml"
      copies: 1000       # 1000 个乙烯单体分子
    - path: "propylene_mapping.yaml"
      copies: 1000       # 1000 个丙烯单体分子

  # ---------------------------------------------------------------------------
  # 工作目录和输出目录（可选，使用默认值）
  # ---------------------------------------------------------------------------
  # work_dir: "work"       # LAMMPS 运行目录（默认 "work"）
  # output_dir: "output"   # 输出文件目录（默认 "output"）
