# mapping.yaml - CG映射配置示例
# 基于 mini_test 示例
#
# 体系: 23 atoms, 1 molecule, 3 beads
#
# Bead 结构:
# - Bead1: 原子 1,2,3,4,7,8,9,10,11,12,13,14,15 (13 atoms)
# - Bead2: 原子 5,6,16,17 (4 atoms)
# - Bead3: 原子 18,19,20,21,22,23 (6 atoms)

# ============================================
# Bead类型名称映射 (可选)
# ============================================
bead_type_names:
  Bead1: 1    # 主要珠子
  Bead2: 2    # 次要珠子
  Bead3: 3    # 末端珠子

# ============================================
# Site类型定义
# ============================================
site-types:
  # Bead1 - 包含原子 1,2,3,4,7,8,9,10,11,12,13,14,15
  # 由于原子不连续，index 需要跳过 5,6
  Bead1:
    index: [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 12, 13, 14]
    x-weight: [12, 12, 12, 12, 1, 1, 1, 1, 1, 1, 1, 1, 1]

  # Bead2 - 包含原子 5,6,16,17
  # 相对于起始位置 4，index = [0, 1, 11, 12]
  Bead2:
    index: [0, 1, 11, 12]
    x-weight: [12, 12, 1, 1]

  # Bead3 - 包含原子 18,19,20,21,22,23
  Bead3:
    index: [0, 1, 2, 3, 4, 5]
    x-weight: [12, 12, 1, 1, 1, 1]

# ============================================
# 映射配置
# ============================================
config:
  - anchor: 0              # 起始原子ID偏移
    repeat: 1              # 重复次数 (分子数)
    offset: 23             # 每个分子间的原子ID偏移
    sites:
      # 每个site定义: [site类型名, 相对于anchor的起始位置]
      - [Bead1, 0]         # Bead1: 原子 1,2,3,4,7,8,9,10,11,12,13,14,15
      - [Bead2, 4]         # Bead2: 原子 5,6,16,17
      - [Bead3, 17]        # Bead3: 原子 18,19,20,21,22,23

# ============================================
# 计算说明
# ============================================
# 原子 ID 计算: atom_id = anchor + site_offset + index + 1
#
# Bead1 (site_offset=0):
#   atoms = 0 + 0 + [0,1,2,3,6,7,8,9,10,11,12,13,14] + 1
#         = [1, 2, 3, 4, 7, 8, 9, 10, 11, 12, 13, 14, 15]
#
# Bead2 (site_offset=4):
#   atoms = 0 + 4 + [0,1,11,12] + 1
#         = [5, 6, 16, 17]
#
# Bead3 (site_offset=17):
#   atoms = 0 + 17 + [0,1,2,3,4,5] + 1
#         = [18, 19, 20, 21, 22, 23]