# rxn1_post_mapping.yaml - 反应后模板 CG 映射
#
# 定义反应后模板原子到粗粒珠子的映射关系
#
# 注意: 反应后 bead 结构可能发生变化
# 例如: 新键形成可能导致 bead 合并或拆分
#
# Bead 类型映射 (来自 mapping.yaml):
#   Bead1 -> 1
#   Bead2 -> 2
#   Bead3 -> 3

mapping:
  # Bead 1: 包含模板原子 1,2,3,4,7,8,9,10,11,12,13,14,15
  1:
    atoms: [1, 2, 3, 4, 7, 8, 9, 10, 11, 12, 13, 14, 15]
    bead_type: 1

  # Bead 2: 包含模板原子 5,6,16,17
  2:
    atoms: [5, 6, 16, 17]
    bead_type: 2

  # Bead 3: 包含模板原子 18,19,20,21,22,23
  # 注意: 反应后 bead_type 可能为 2
  3:
    atoms: [18, 19, 20, 21, 22, 23]
    bead_type: 2