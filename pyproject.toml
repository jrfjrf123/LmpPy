[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmp-py-react"
version = "0.1.0"
description = "LAMMPS Bond/React post-processing framework with CG mapping"
readme = "samples_collection_md/LmpPy/README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Rui-Feng Jiang"}
]
keywords = ["lammps", "molecular-dynamics", "coarse-grained", "reaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mpi = [
    "mpi4py>=3.1.0",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/user/lmp_py_react"

[tool.setuptools.packages.find]
where = ["samples_collection_md"]
include = ["LmpPy*", "LmpPy.core*", "LmpPy.utils*"]

[tool.setuptools.package-data]
"LmpPy" = ["config/*.yaml", "docs/**/*.md"]